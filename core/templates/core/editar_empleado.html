{% extends "base.html" %}
{% block title %}Editar empleado{% endblock %}
{% block content %}
<h2>Editar: {{ emp.nombre }}</h2>
<a href="{% url 'core:lista' %}" class="btn">Volver</a>
<form method="post" style="margin-top:1rem;max-width:400px;">
{% csrf_token %}
{% for field in form %}
<div class="form-row">
<label>{{ field.label }}</label>
{{ field }}
{% if field.errors %}<ul class="errorlist">{{ field.errors }}</ul>{% endif %}
</div>
{% endfor %}
<button type="submit" class="btn">Actualizar</button>
</form>
{% endblock %}
